# .github/workflows/verify-phases-11-14.yml — Stage B Verification
# Per the Stage B Verification Suite spec §1.3.
#
# This workflow runs REAL integration tests against live Postgres + Redis + pgbouncer.
# It converts 42 UNVERIFIED items to PASS or FAIL with real evidence.
#
# Trigger: push to verify-phases-11-14 branch, or manual dispatch.

name: Verify Phases 11-14 (Stage B)

on:
  push:
    branches: [verify-phases-11-14]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: noventra_verify
          POSTGRES_USER: noventra
          POSTGRES_PASSWORD: verify_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noventra -d noventra_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      pgbouncer:
        image: edoburu/pgbouncer:1.23.1
        env:
          DB_USER: noventra
          DB_PASSWORD: verify_password
          DB_HOST: postgres
          DB_NAME: noventra_verify
          POOL_MODE: transaction
          MAX_CLIENT_CONN: 1000
        ports:
          - 6432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -p 5432 -U noventra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-verify-secret-key-not-for-production
      DATABASE_URL: postgres://noventra:verify_password@localhost:5432/noventra_verify
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: noventra.settings.test
      DEBUG: "false"
      ALLOWED_HOSTS: "*"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install verification tools
        run: pip install bandit pip-audit pytest-asyncio pytest-xdist hypothesis httpx websockets locust

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Bootstrap verification data
        run: python manage.py bootstrap_verify_data

      # ── Static Analysis ──────────────────────────────────────────

      - name: Run linter (rules 1-110)
        run: bash scripts/check_traceability.sh

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Run mypy strict
        run: mypy --strict src/noventra/modules/ledger/ src/noventra/modules/fx/ src/noventra/modules/bonuses/ src/noventra/modules/protection/

      - name: Run bandit SAST
        run: bandit -r src/ -ll || true

      - name: Run pip-audit
        run: pip-audit --strict || true

      # ── Full Test Suite ──────────────────────────────────────────

      - name: Run full test suite with coverage
        run: |
          pytest \
            --cov=src/noventra/modules/ledger \
            --cov=src/noventra/modules/fx \
            --cov=src/noventra/modules/bonuses \
            --cov=src/noventra/modules/protection \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --cov-fail-under=95 \
            -v

      # ── Phase 11 Concurrency Tests ───────────────────────────────

      - name: Run Phase 11 concurrency tests
        run: pytest tests/concurrency/ -v --no-header

      # ── Phase 11 Financial Audit Chain Tamper Test ───────────────

      - name: Run financial audit chain tamper test
        run: pytest tests/security/test_financial_audit_chain_tamper.py -v

      # ── Phase 12 PCI DLP Injection Test ──────────────────────────

      - name: Run PCI DLP injection test
        run: pytest tests/security/test_pci_dlp_injection.py -v

      # ── Phase 14 Cross-Module SE Enforcement Test ────────────────

      - name: Run Phase 14 cross-module SE enforcement test
        run: pytest tests/integration/test_cross_module_se_enforcement.py -v

      # ── Phase 14 SE-survives-erasure Test ────────────────────────

      - name: Run Phase 14 SE-survives-erasure test
        run: pytest tests/integration/test_se_survives_erasure.py -v

      # ── Kill Switch <200ms SLO Load Test ─────────────────────────

      - name: Run <200ms SLO load test
        run: |
          mkdir -p verify-results
          python manage.py runserver 0.0.0.0:8000 &
          SERVER_PID=$!
          sleep 10
          python scripts/kill_switch_load_test.py \
            --target http://localhost:8000 \
            --connections 100 \
            --triggers 10 \
            --output verify-results/kill_switch_results.json
          kill $SERVER_PID
          python scripts/verify_kill_switch_slo.py \
            --input verify-results/kill_switch_results.json \
            --threshold-ms 200

      # ── Generate Report + Check Gate ─────────────────────────────

      - name: Generate verification report
        if: always()
        run: python scripts/generate_verification_report.py --output docs/audits/stage-b-verification-report.md

      - name: Check gate
        if: always()
        run: python scripts/check_phase_15_gate.py --report docs/audits/stage-b-verification-report.md

      - name: Upload verification results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-results
          path: |
            verify-results/
            coverage.xml
            docs/audits/stage-b-verification-report.md
