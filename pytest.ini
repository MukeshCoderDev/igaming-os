# pytest.ini — Phase 3 stub.
# Pytest config also lives in pyproject.toml [tool.pytest.ini_options].
# This file is a minimal stub for tools that look for pytest.ini explicitly.

[pytest]
DJANGO_SETTINGS_MODULE = noventra.settings.test
python_files = test_*.py *_test.py
addopts = --strict-markers --tb=short --reuse-db
testpaths = tests
