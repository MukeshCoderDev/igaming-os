[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noventra"
version = "0.3.0"
description = "Noventra — B2B OS provider platform (Phase 3 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Architecture Lead", email = "arch@noventra.example" },
]
# Pinned dependencies per ADR-0022 / DEC-0027.
# Phase 3 pins: Django 5.0, DRF 3.15, drf-spectacular 0.27, psycopg 3.2,
# redis 5.0, ruff 0.6, pytest 8.3.
dependencies = [
    "Django==5.0.9",
    "djangorestframework==3.15.2",
    "drf-spectacular==0.27.2",
    "psycopg[binary]==3.2.3",
    "redis==5.0.8",
    "environs==11.0.0",
    "gunicorn==23.0.0",
    # Phase 4: observability (ADR-0025, ADR-0017).
    "structlog==24.4.0",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "pytest==8.3.3",
    "pytest-django==4.9.0",
    "pytest-cov==5.0.0",
    "factory-boy==3.3.1",
    "pre-commit==4.0.1",
    # Phase 4: type checking + coverage diff (ADR-0027).
    "mypy==1.13.0",
    "diff-cover==9.1.1",
    "types-redis==4.6.0.20240903",
]

[project.urls]
Documentation = "docs/BLUEPRINT.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noventra = ["py.typed"]

# ─── Ruff (lint + format) per ADR-0024 / CI ──────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Per Phase 3 spec output #7: ruff (I, F401, E402, F403/F405).
select = ["I", "F401", "E402", "F403", "F405", "E", "F"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["noventra"]

# ─── Pytest per ADR-0024 ────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "noventra.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--reuse-db",
]
testpaths = ["tests"]

# ─── Coverage ───────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/noventra"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/management/commands/*",
    "*/apps/*/api/*",  # Phase 4: API layer excluded; covered in Phase 5+
]
branch = false  # Phase 8: branch = true (mandatory per ADR-0027).

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ─── mypy (ADR-0027 / DEC-0032) ────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual; strict_modules enforces per-module.
ignore_missing_imports = true  # Phase 4 stub; Phase 5+ tightens.
plugins = []

# Strict modules list (Phase 4). Linter rule 18 verifies this list is clean.
# Per ADR-0027: strict_modules = Phase 3+4 packages. Grows per phase.
[[tool.mypy.overrides]]
module = [
    "noventra.settings.*",
    "noventra.api.health",
    "noventra.api.metrics",
    "noventra.apps.core.*",
    "noventra.apps.tenancy.domain.*",
    "noventra.apps.identity.domain.*",
    "noventra.apps.audit.domain.*",
    "noventra.apps.reliability.domain.*",
    "noventra.observability.*",
    "noventra.middleware.*",
    "noventra.errors.*",
]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_unimported = false
strict_equality = true
